name: WebDriverAgent Xcode Tests

on:
  pull_request:
    # Native WDA sources only; TS-only changes are covered by build.yml (unit) and the functional tests.
    paths:
      - 'packages/webdriveragent/Configurations/**'
      - 'packages/webdriveragent/Fastlane/**'
      - 'packages/webdriveragent/PrivateHeaders/**'
      - 'packages/webdriveragent/Scripts/build.sh'
      - 'packages/webdriveragent/WebDriverAgent.xcodeproj/**'
      - 'packages/webdriveragent/WebDriverAgentLib/**'
      - 'packages/webdriveragent/WebDriverAgentRunner/**'
      - 'packages/webdriveragent/WebDriverAgentTests/**'
      - 'packages/webdriveragent/Gemfile*'
      - '.github/workflows/webdriveragent-xcode-tests.yml'
      - '.github/actions/webdriveragent-xcode-setup/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  xcode_matrix:
    uses: ./.github/workflows/ios-xcode-matrix.yml

  build_matrix:
    needs: xcode_matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          cat <<'MATRIX_JSON' | jq -c . > matrix.json
          [
            {"name": "Generic_iOS_Build_Max_Xcode", "vm_image": "${{ fromJSON(needs.xcode_matrix.outputs.max).image }}", "xcode_version": "${{ fromJSON(needs.xcode_matrix.outputs.max).xcodeVersion }}", "action": "build", "target": "runner", "sdk": "sim", "dest": "generic", "code_sign": "no"},
            {"name": "Generic_iOS_Build_Min_Xcode", "vm_image": "${{ fromJSON(needs.xcode_matrix.outputs.min).image }}", "xcode_version": "${{ fromJSON(needs.xcode_matrix.outputs.min).xcodeVersion }}", "action": "build", "target": "runner", "sdk": "sim", "dest": "generic", "code_sign": "no"},
            {"name": "Generic_tvOS_Build_Max_Xcode", "vm_image": "${{ fromJSON(needs.xcode_matrix.outputs.max).image }}", "xcode_version": "${{ fromJSON(needs.xcode_matrix.outputs.max).xcodeVersion }}", "action": "build", "target": "tv_runner", "sdk": "tv_sim", "dest": "tv_generic", "code_sign": "no"},
            {"name": "Generic_tvOS_Build_Min_Xcode", "vm_image": "${{ fromJSON(needs.xcode_matrix.outputs.min).image }}", "xcode_version": "${{ fromJSON(needs.xcode_matrix.outputs.min).xcodeVersion }}", "action": "build", "target": "tv_runner", "sdk": "tv_sim", "dest": "tv_generic", "code_sign": "no"},
            {"name": "Generic_watchOS_Build_Max_Xcode", "vm_image": "${{ fromJSON(needs.xcode_matrix.outputs.max).image }}", "xcode_version": "${{ fromJSON(needs.xcode_matrix.outputs.max).xcodeVersion }}", "action": "build", "target": "watch_runner", "sdk": "watch_sim", "dest": "watch_generic", "code_sign": "no"},
            {"name": "Generic_watchOS_Build_Min_Xcode", "vm_image": "${{ fromJSON(needs.xcode_matrix.outputs.min).image }}", "xcode_version": "${{ fromJSON(needs.xcode_matrix.outputs.min).xcodeVersion }}", "action": "build", "target": "watch_runner", "sdk": "watch_sim", "dest": "watch_generic", "code_sign": "no"},
            {"name": "iOS_Build_Max_Xcode", "vm_image": "${{ fromJSON(needs.xcode_matrix.outputs.max).image }}", "xcode_version": "${{ fromJSON(needs.xcode_matrix.outputs.max).xcodeVersion }}", "action": "build", "target": "runner", "sdk": "sim", "iphone_model": "${{ fromJSON(needs.xcode_matrix.outputs.max).deviceName }}", "ipad_model": "${{ fromJSON(needs.xcode_matrix.outputs.max).ipadDeviceName }}", "ios_version": "${{ fromJSON(needs.xcode_matrix.outputs.max).iosVersion }}"},
            {"name": "iOS_Build_Min_Xcode", "vm_image": "${{ fromJSON(needs.xcode_matrix.outputs.min).image }}", "xcode_version": "${{ fromJSON(needs.xcode_matrix.outputs.min).xcodeVersion }}", "action": "build", "target": "runner", "sdk": "sim", "iphone_model": "${{ fromJSON(needs.xcode_matrix.outputs.min).deviceName }}", "ipad_model": "${{ fromJSON(needs.xcode_matrix.outputs.min).ipadDeviceName }}", "ios_version": "${{ fromJSON(needs.xcode_matrix.outputs.min).iosVersion }}"},
            {"name": "tvOS_Build_Max_Xcode", "vm_image": "${{ fromJSON(needs.xcode_matrix.outputs.max).image }}", "xcode_version": "${{ fromJSON(needs.xcode_matrix.outputs.max).xcodeVersion }}", "action": "build", "target": "tv_runner", "sdk": "tv_sim", "tv_model": "${{ fromJSON(needs.xcode_matrix.outputs.max).tvosDeviceName }}", "tv_version": "${{ fromJSON(needs.xcode_matrix.outputs.max).tvosVersion }}"},
            {"name": "tvOS_Build_Min_Xcode", "vm_image": "${{ fromJSON(needs.xcode_matrix.outputs.min).image }}", "xcode_version": "${{ fromJSON(needs.xcode_matrix.outputs.min).xcodeVersion }}", "action": "build", "target": "tv_runner", "sdk": "tv_sim", "dest": "tv", "tv_model": "${{ fromJSON(needs.xcode_matrix.outputs.min).tvosDeviceName }}", "tv_version": "${{ fromJSON(needs.xcode_matrix.outputs.min).tvosVersion }}"},
            {"name": "watchOS_Build_Max_Xcode", "vm_image": "${{ fromJSON(needs.xcode_matrix.outputs.max).image }}", "xcode_version": "${{ fromJSON(needs.xcode_matrix.outputs.max).xcodeVersion }}", "action": "build", "target": "watch_runner", "sdk": "watch_sim", "dest": "watch", "watch_model": "${{ fromJSON(needs.xcode_matrix.outputs.max).watchosDeviceName }}", "watch_version": "${{ fromJSON(needs.xcode_matrix.outputs.max).watchosVersion }}"},
            {"name": "watchOS_Build_Min_Xcode", "vm_image": "${{ fromJSON(needs.xcode_matrix.outputs.min).image }}", "xcode_version": "${{ fromJSON(needs.xcode_matrix.outputs.min).xcodeVersion }}", "action": "build", "target": "watch_runner", "sdk": "watch_sim", "dest": "watch", "watch_model": "${{ fromJSON(needs.xcode_matrix.outputs.min).watchosDeviceName }}", "watch_version": "${{ fromJSON(needs.xcode_matrix.outputs.min).watchosVersion }}"}
          ]
          MATRIX_JSON
          echo "matrix=$(cat matrix.json)" >> $GITHUB_OUTPUT

  analyze_matrix:
    needs: xcode_matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          cat <<'MATRIX_JSON' | jq -c . > matrix.json
          [
            {"name": "iOS_Lib_Analyze_Max_Xcode", "vm_image": "${{ fromJSON(needs.xcode_matrix.outputs.max).image }}", "xcode_version": "${{ fromJSON(needs.xcode_matrix.outputs.max).xcodeVersion }}", "target": "lib", "sdk": "sim", "iphone_model": "${{ fromJSON(needs.xcode_matrix.outputs.max).deviceName }}", "ipad_model": "${{ fromJSON(needs.xcode_matrix.outputs.max).ipadDeviceName }}", "ios_version": "${{ fromJSON(needs.xcode_matrix.outputs.max).iosVersion }}"},
            {"name": "iOS_Lib_Analyze_Min_Xcode", "vm_image": "${{ fromJSON(needs.xcode_matrix.outputs.min).image }}", "xcode_version": "${{ fromJSON(needs.xcode_matrix.outputs.min).xcodeVersion }}", "target": "lib", "sdk": "sim", "iphone_model": "${{ fromJSON(needs.xcode_matrix.outputs.min).deviceName }}", "ipad_model": "${{ fromJSON(needs.xcode_matrix.outputs.min).ipadDeviceName }}", "ios_version": "${{ fromJSON(needs.xcode_matrix.outputs.min).iosVersion }}"},
            {"name": "iOS_Runner_Analyze_Max_Xcode", "vm_image": "${{ fromJSON(needs.xcode_matrix.outputs.max).image }}", "xcode_version": "${{ fromJSON(needs.xcode_matrix.outputs.max).xcodeVersion }}", "target": "runner", "sdk": "sim", "iphone_model": "${{ fromJSON(needs.xcode_matrix.outputs.max).deviceName }}", "ipad_model": "${{ fromJSON(needs.xcode_matrix.outputs.max).ipadDeviceName }}", "ios_version": "${{ fromJSON(needs.xcode_matrix.outputs.max).iosVersion }}"},
            {"name": "iOS_Runner_Analyze_Min_Xcode", "vm_image": "${{ fromJSON(needs.xcode_matrix.outputs.min).image }}", "xcode_version": "${{ fromJSON(needs.xcode_matrix.outputs.min).xcodeVersion }}", "target": "runner", "sdk": "sim", "iphone_model": "${{ fromJSON(needs.xcode_matrix.outputs.min).deviceName }}", "ipad_model": "${{ fromJSON(needs.xcode_matrix.outputs.min).ipadDeviceName }}", "ios_version": "${{ fromJSON(needs.xcode_matrix.outputs.min).iosVersion }}"},
            {"name": "tvOS_Lib_Analyze_Max_Xcode", "vm_image": "${{ fromJSON(needs.xcode_matrix.outputs.max).image }}", "xcode_version": "${{ fromJSON(needs.xcode_matrix.outputs.max).xcodeVersion }}", "target": "tv_lib", "sdk": "tv_sim", "tv_model": "${{ fromJSON(needs.xcode_matrix.outputs.max).tvosDeviceName }}", "tv_version": "${{ fromJSON(needs.xcode_matrix.outputs.max).tvosVersion }}"},
            {"name": "tvOS_Lib_Analyze_Min_Xcode", "vm_image": "${{ fromJSON(needs.xcode_matrix.outputs.min).image }}", "xcode_version": "${{ fromJSON(needs.xcode_matrix.outputs.min).xcodeVersion }}", "target": "tv_lib", "sdk": "tv_sim", "tv_model": "${{ fromJSON(needs.xcode_matrix.outputs.min).tvosDeviceName }}", "tv_version": "${{ fromJSON(needs.xcode_matrix.outputs.min).tvosVersion }}"},
            {"name": "tvOS_Runner_Analyze_Max_Xcode", "vm_image": "${{ fromJSON(needs.xcode_matrix.outputs.max).image }}", "xcode_version": "${{ fromJSON(needs.xcode_matrix.outputs.max).xcodeVersion }}", "target": "tv_runner", "sdk": "tv_sim", "tv_model": "${{ fromJSON(needs.xcode_matrix.outputs.max).tvosDeviceName }}", "tv_version": "${{ fromJSON(needs.xcode_matrix.outputs.max).tvosVersion }}"},
            {"name": "tvOS_Runner_Analyze_Min_Xcode", "vm_image": "${{ fromJSON(needs.xcode_matrix.outputs.min).image }}", "xcode_version": "${{ fromJSON(needs.xcode_matrix.outputs.min).xcodeVersion }}", "target": "tv_runner", "sdk": "tv_sim", "tv_model": "${{ fromJSON(needs.xcode_matrix.outputs.min).tvosDeviceName }}", "tv_version": "${{ fromJSON(needs.xcode_matrix.outputs.min).tvosVersion }}"},
            {"name": "watchOS_Lib_Analyze_Max_Xcode", "vm_image": "${{ fromJSON(needs.xcode_matrix.outputs.max).image }}", "xcode_version": "${{ fromJSON(needs.xcode_matrix.outputs.max).xcodeVersion }}", "target": "watch_lib", "sdk": "watch_sim", "watch_model": "${{ fromJSON(needs.xcode_matrix.outputs.max).watchosDeviceName }}", "watch_version": "${{ fromJSON(needs.xcode_matrix.outputs.max).watchosVersion }}"},
            {"name": "watchOS_Lib_Analyze_Min_Xcode", "vm_image": "${{ fromJSON(needs.xcode_matrix.outputs.min).image }}", "xcode_version": "${{ fromJSON(needs.xcode_matrix.outputs.min).xcodeVersion }}", "target": "watch_lib", "sdk": "watch_sim", "watch_model": "${{ fromJSON(needs.xcode_matrix.outputs.min).watchosDeviceName }}", "watch_version": "${{ fromJSON(needs.xcode_matrix.outputs.min).watchosVersion }}"},
            {"name": "watchOS_Runner_Analyze_Max_Xcode", "vm_image": "${{ fromJSON(needs.xcode_matrix.outputs.max).image }}", "xcode_version": "${{ fromJSON(needs.xcode_matrix.outputs.max).xcodeVersion }}", "target": "watch_runner", "sdk": "watch_sim", "watch_model": "${{ fromJSON(needs.xcode_matrix.outputs.max).watchosDeviceName }}", "watch_version": "${{ fromJSON(needs.xcode_matrix.outputs.max).watchosVersion }}"},
            {"name": "watchOS_Runner_Analyze_Min_Xcode", "vm_image": "${{ fromJSON(needs.xcode_matrix.outputs.min).image }}", "xcode_version": "${{ fromJSON(needs.xcode_matrix.outputs.min).xcodeVersion }}", "target": "watch_runner", "sdk": "watch_sim", "watch_model": "${{ fromJSON(needs.xcode_matrix.outputs.min).watchosDeviceName }}", "watch_version": "${{ fromJSON(needs.xcode_matrix.outputs.min).watchosVersion }}"}
          ]
          MATRIX_JSON
          echo "matrix=$(cat matrix.json)" >> $GITHUB_OUTPUT

  unit_test_matrix:
    needs: xcode_matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          cat <<'MATRIX_JSON' | jq -c . > matrix.json
          [
            {"name": "iPhone_Unit_Test_Max_Xcode", "vm_image": "${{ fromJSON(needs.xcode_matrix.outputs.max).image }}", "xcode_version": "${{ fromJSON(needs.xcode_matrix.outputs.max).xcodeVersion }}", "iphone_model": "${{ fromJSON(needs.xcode_matrix.outputs.max).deviceName }}", "ipad_model": "${{ fromJSON(needs.xcode_matrix.outputs.max).ipadDeviceName }}", "ios_version": "${{ fromJSON(needs.xcode_matrix.outputs.max).iosVersion }}"},
            {"name": "iPhone_Unit_Test_Min_Xcode", "vm_image": "${{ fromJSON(needs.xcode_matrix.outputs.min).image }}", "xcode_version": "${{ fromJSON(needs.xcode_matrix.outputs.min).xcodeVersion }}", "iphone_model": "${{ fromJSON(needs.xcode_matrix.outputs.min).deviceName }}", "ipad_model": "${{ fromJSON(needs.xcode_matrix.outputs.min).ipadDeviceName }}", "ios_version": "${{ fromJSON(needs.xcode_matrix.outputs.min).iosVersion }}"}
          ]
          MATRIX_JSON
          echo "matrix=$(cat matrix.json)" >> $GITHUB_OUTPUT

  integration_test_matrix:
    needs: xcode_matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          cat <<'MATRIX_JSON' | jq -c . > matrix.json
          [
            {"name": "iphone_int_test_1_Max_Xcode", "vm_image": "${{ fromJSON(needs.xcode_matrix.outputs.max).image }}", "xcode_version": "${{ fromJSON(needs.xcode_matrix.outputs.max).xcodeVersion }}", "action": "int_test_1", "dest": "iphone", "sdk": "sim", "iphone_model": "${{ fromJSON(needs.xcode_matrix.outputs.max).deviceName }}", "ipad_model": "${{ fromJSON(needs.xcode_matrix.outputs.max).ipadDeviceName }}", "ios_version": "${{ fromJSON(needs.xcode_matrix.outputs.max).iosVersion }}"},
            {"name": "iphone_int_test_2_Max_Xcode", "vm_image": "${{ fromJSON(needs.xcode_matrix.outputs.max).image }}", "xcode_version": "${{ fromJSON(needs.xcode_matrix.outputs.max).xcodeVersion }}", "action": "int_test_2", "dest": "iphone", "sdk": "sim", "iphone_model": "${{ fromJSON(needs.xcode_matrix.outputs.max).deviceName }}", "ipad_model": "${{ fromJSON(needs.xcode_matrix.outputs.max).ipadDeviceName }}", "ios_version": "${{ fromJSON(needs.xcode_matrix.outputs.max).iosVersion }}"},
            {"name": "iphone_int_test_3_Max_Xcode", "vm_image": "${{ fromJSON(needs.xcode_matrix.outputs.max).image }}", "xcode_version": "${{ fromJSON(needs.xcode_matrix.outputs.max).xcodeVersion }}", "action": "int_test_3", "dest": "iphone", "sdk": "sim", "iphone_model": "${{ fromJSON(needs.xcode_matrix.outputs.max).deviceName }}", "ipad_model": "${{ fromJSON(needs.xcode_matrix.outputs.max).ipadDeviceName }}", "ios_version": "${{ fromJSON(needs.xcode_matrix.outputs.max).iosVersion }}"},
            {"name": "ipad_int_test_1_Max_Xcode", "vm_image": "${{ fromJSON(needs.xcode_matrix.outputs.max).image }}", "xcode_version": "${{ fromJSON(needs.xcode_matrix.outputs.max).xcodeVersion }}", "action": "int_test_1", "dest": "ipad", "sdk": "sim", "iphone_model": "${{ fromJSON(needs.xcode_matrix.outputs.max).deviceName }}", "ipad_model": "${{ fromJSON(needs.xcode_matrix.outputs.max).ipadDeviceName }}", "ios_version": "${{ fromJSON(needs.xcode_matrix.outputs.max).iosVersion }}"},
            {"name": "ipad_int_test_2_Max_Xcode", "vm_image": "${{ fromJSON(needs.xcode_matrix.outputs.max).image }}", "xcode_version": "${{ fromJSON(needs.xcode_matrix.outputs.max).xcodeVersion }}", "action": "int_test_2", "dest": "ipad", "sdk": "sim", "iphone_model": "${{ fromJSON(needs.xcode_matrix.outputs.max).deviceName }}", "ipad_model": "${{ fromJSON(needs.xcode_matrix.outputs.max).ipadDeviceName }}", "ios_version": "${{ fromJSON(needs.xcode_matrix.outputs.max).iosVersion }}"},
            {"name": "ipad_int_test_3_Max_Xcode", "vm_image": "${{ fromJSON(needs.xcode_matrix.outputs.max).image }}", "xcode_version": "${{ fromJSON(needs.xcode_matrix.outputs.max).xcodeVersion }}", "action": "int_test_3", "dest": "ipad", "sdk": "sim", "iphone_model": "${{ fromJSON(needs.xcode_matrix.outputs.max).deviceName }}", "ipad_model": "${{ fromJSON(needs.xcode_matrix.outputs.max).ipadDeviceName }}", "ios_version": "${{ fromJSON(needs.xcode_matrix.outputs.max).iosVersion }}"},
            {"name": "iphone_int_test_1_Min_Xcode", "vm_image": "${{ fromJSON(needs.xcode_matrix.outputs.min).image }}", "xcode_version": "${{ fromJSON(needs.xcode_matrix.outputs.min).xcodeVersion }}", "action": "int_test_1", "dest": "iphone", "sdk": "sim", "iphone_model": "${{ fromJSON(needs.xcode_matrix.outputs.min).deviceName }}", "ipad_model": "${{ fromJSON(needs.xcode_matrix.outputs.min).ipadDeviceName }}", "ios_version": "${{ fromJSON(needs.xcode_matrix.outputs.min).iosVersion }}"},
            {"name": "iphone_int_test_2_Min_Xcode", "vm_image": "${{ fromJSON(needs.xcode_matrix.outputs.min).image }}", "xcode_version": "${{ fromJSON(needs.xcode_matrix.outputs.min).xcodeVersion }}", "action": "int_test_2", "dest": "iphone", "sdk": "sim", "iphone_model": "${{ fromJSON(needs.xcode_matrix.outputs.min).deviceName }}", "ipad_model": "${{ fromJSON(needs.xcode_matrix.outputs.min).ipadDeviceName }}", "ios_version": "${{ fromJSON(needs.xcode_matrix.outputs.min).iosVersion }}"},
            {"name": "iphone_int_test_3_Min_Xcode", "vm_image": "${{ fromJSON(needs.xcode_matrix.outputs.min).image }}", "xcode_version": "${{ fromJSON(needs.xcode_matrix.outputs.min).xcodeVersion }}", "action": "int_test_3", "dest": "iphone", "sdk": "sim", "iphone_model": "${{ fromJSON(needs.xcode_matrix.outputs.min).deviceName }}", "ipad_model": "${{ fromJSON(needs.xcode_matrix.outputs.min).ipadDeviceName }}", "ios_version": "${{ fromJSON(needs.xcode_matrix.outputs.min).iosVersion }}"},
            {"name": "ipad_int_test_1_Min_Xcode", "vm_image": "${{ fromJSON(needs.xcode_matrix.outputs.min).image }}", "xcode_version": "${{ fromJSON(needs.xcode_matrix.outputs.min).xcodeVersion }}", "action": "int_test_1", "dest": "ipad", "sdk": "sim", "iphone_model": "${{ fromJSON(needs.xcode_matrix.outputs.min).deviceName }}", "ipad_model": "${{ fromJSON(needs.xcode_matrix.outputs.min).ipadDeviceName }}", "ios_version": "${{ fromJSON(needs.xcode_matrix.outputs.min).iosVersion }}"},
            {"name": "ipad_int_test_2_Min_Xcode", "vm_image": "${{ fromJSON(needs.xcode_matrix.outputs.min).image }}", "xcode_version": "${{ fromJSON(needs.xcode_matrix.outputs.min).xcodeVersion }}", "action": "int_test_2", "dest": "ipad", "sdk": "sim", "iphone_model": "${{ fromJSON(needs.xcode_matrix.outputs.min).deviceName }}", "ipad_model": "${{ fromJSON(needs.xcode_matrix.outputs.min).ipadDeviceName }}", "ios_version": "${{ fromJSON(needs.xcode_matrix.outputs.min).iosVersion }}"},
            {"name": "ipad_int_test_3_Min_Xcode", "vm_image": "${{ fromJSON(needs.xcode_matrix.outputs.min).image }}", "xcode_version": "${{ fromJSON(needs.xcode_matrix.outputs.min).xcodeVersion }}", "action": "int_test_3", "dest": "ipad", "sdk": "sim", "iphone_model": "${{ fromJSON(needs.xcode_matrix.outputs.min).deviceName }}", "ipad_model": "${{ fromJSON(needs.xcode_matrix.outputs.min).ipadDeviceName }}", "ios_version": "${{ fromJSON(needs.xcode_matrix.outputs.min).iosVersion }}"},
            {"name": "tv_int_test_Max_Xcode", "vm_image": "${{ fromJSON(needs.xcode_matrix.outputs.max).image }}", "xcode_version": "${{ fromJSON(needs.xcode_matrix.outputs.max).xcodeVersion }}", "action": "tv_int_test", "dest": "tv", "sdk": "tv_sim", "tv_model": "${{ fromJSON(needs.xcode_matrix.outputs.max).tvosDeviceName }}", "tv_version": "${{ fromJSON(needs.xcode_matrix.outputs.max).tvosVersion }}"},
            {"name": "tv_int_test_Min_Xcode", "vm_image": "${{ fromJSON(needs.xcode_matrix.outputs.min).image }}", "xcode_version": "${{ fromJSON(needs.xcode_matrix.outputs.min).xcodeVersion }}", "action": "tv_int_test", "dest": "tv", "sdk": "tv_sim", "tv_model": "${{ fromJSON(needs.xcode_matrix.outputs.min).tvosDeviceName }}", "tv_version": "${{ fromJSON(needs.xcode_matrix.outputs.min).tvosVersion }}"},
            {"name": "watch_int_test_Max_Xcode", "vm_image": "${{ fromJSON(needs.xcode_matrix.outputs.max).image }}", "xcode_version": "${{ fromJSON(needs.xcode_matrix.outputs.max).xcodeVersion }}", "action": "watch_int_test", "dest": "watch", "sdk": "watch_sim", "watch_model": "${{ fromJSON(needs.xcode_matrix.outputs.max).watchosDeviceName }}", "watch_version": "${{ fromJSON(needs.xcode_matrix.outputs.max).watchosVersion }}"},
            {"name": "watch_int_test_Min_Xcode", "vm_image": "${{ fromJSON(needs.xcode_matrix.outputs.min).image }}", "xcode_version": "${{ fromJSON(needs.xcode_matrix.outputs.min).xcodeVersion }}", "action": "watch_int_test", "dest": "watch", "sdk": "watch_sim", "watch_model": "${{ fromJSON(needs.xcode_matrix.outputs.min).watchosDeviceName }}", "watch_version": "${{ fromJSON(needs.xcode_matrix.outputs.min).watchosVersion }}"}
          ]
          MATRIX_JSON
          echo "matrix=$(cat matrix.json)" >> $GITHUB_OUTPUT

  build_tests_matrix:
    needs: xcode_matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        # One build per Xcode version and platform: the integration test jobs only run the
        # prebuilt products. iOS builds the three chunk schemes together to share the compilation.
        run: |
          cat <<'MATRIX_JSON' | jq -c . > matrix.json
          [
            {"name": "iOS_Tests_Build_Max_Xcode", "vm_image": "${{ fromJSON(needs.xcode_matrix.outputs.max).image }}", "xcode_version": "${{ fromJSON(needs.xcode_matrix.outputs.max).xcodeVersion }}", "sdk": "sim", "schemes": "IntegrationTests_1 IntegrationTests_2 IntegrationTests_3"},
            {"name": "iOS_Tests_Build_Min_Xcode", "vm_image": "${{ fromJSON(needs.xcode_matrix.outputs.min).image }}", "xcode_version": "${{ fromJSON(needs.xcode_matrix.outputs.min).xcodeVersion }}", "sdk": "sim", "schemes": "IntegrationTests_1 IntegrationTests_2 IntegrationTests_3"},
            {"name": "tvOS_Tests_Build_Max_Xcode", "vm_image": "${{ fromJSON(needs.xcode_matrix.outputs.max).image }}", "xcode_version": "${{ fromJSON(needs.xcode_matrix.outputs.max).xcodeVersion }}", "sdk": "tv_sim", "schemes": "IntegrationTests_tvOS"},
            {"name": "tvOS_Tests_Build_Min_Xcode", "vm_image": "${{ fromJSON(needs.xcode_matrix.outputs.min).image }}", "xcode_version": "${{ fromJSON(needs.xcode_matrix.outputs.min).xcodeVersion }}", "sdk": "tv_sim", "schemes": "IntegrationTests_tvOS"},
            {"name": "watchOS_Tests_Build_Max_Xcode", "vm_image": "${{ fromJSON(needs.xcode_matrix.outputs.max).image }}", "xcode_version": "${{ fromJSON(needs.xcode_matrix.outputs.max).xcodeVersion }}", "sdk": "watch_sim", "schemes": "IntegrationTests_watchOS"},
            {"name": "watchOS_Tests_Build_Min_Xcode", "vm_image": "${{ fromJSON(needs.xcode_matrix.outputs.min).image }}", "xcode_version": "${{ fromJSON(needs.xcode_matrix.outputs.min).xcodeVersion }}", "sdk": "watch_sim", "schemes": "IntegrationTests_watchOS"}
          ]
          MATRIX_JSON
          echo "matrix=$(cat matrix.json)" >> $GITHUB_OUTPUT

  build:
    needs: build_matrix
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.vm_image }}
    defaults:
      run:
        working-directory: packages/webdriveragent
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.build_matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/webdriveragent-xcode-setup
        with:
          xcode_version: ${{ matrix.config.xcode_version }}
      # xcodebuild intermittently misses the simulator on a fresh runner (build.sh now uses its
      # UDID and retries); log what the runner sees to diagnose it if it still happens.
      - name: Log tvOS simulators
        if: matrix.config.dest == 'tv'
        continue-on-error: true
        run: |
          xcrun simctl list runtimes
          xcrun simctl list devices available | grep -A6 'tvOS' || true
          xcodebuild -project WebDriverAgent.xcodeproj -scheme WebDriverAgentRunner_tvOS -showdestinations || true
      - name: Build
        run: ./Scripts/build.sh
        env:
          ACTION: ${{ matrix.config.action }}
          TARGET: ${{ matrix.config.target }}
          SDK: ${{ matrix.config.sdk }}
          DEST: ${{ matrix.config.dest }}
          CODE_SIGN: ${{ matrix.config.code_sign }}
          IPHONE_MODEL: ${{ matrix.config.iphone_model }}
          IPAD_MODEL: ${{ matrix.config.ipad_model }}
          IOS_VERSION: ${{ matrix.config.ios_version }}
          TV_MODEL: ${{ matrix.config.tv_model }}
          TV_VERSION: ${{ matrix.config.tv_version }}
          WATCH_MODEL: ${{ matrix.config.watch_model }}
          WATCH_VERSION: ${{ matrix.config.watch_version }}
      - name: Log tvOS simulators after failure
        if: failure() && matrix.config.dest == 'tv'
        continue-on-error: true
        run: |
          xcrun simctl list devices | grep -A6 'tvOS' || true
          xcodebuild -project WebDriverAgent.xcodeproj -scheme WebDriverAgentRunner_tvOS -showdestinations || true

  analyze:
    needs: analyze_matrix
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.vm_image }}
    defaults:
      run:
        working-directory: packages/webdriveragent
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.analyze_matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/webdriveragent-xcode-setup
        with:
          xcode_version: ${{ matrix.config.xcode_version }}
      - name: Analyze
        run: ./Scripts/build.sh
        env:
          ACTION: analyze
          TARGET: ${{ matrix.config.target }}
          SDK: ${{ matrix.config.sdk }}
          IPHONE_MODEL: ${{ matrix.config.iphone_model }}
          IPAD_MODEL: ${{ matrix.config.ipad_model }}
          IOS_VERSION: ${{ matrix.config.ios_version }}
          TV_MODEL: ${{ matrix.config.tv_model }}
          TV_VERSION: ${{ matrix.config.tv_version }}
          WATCH_MODEL: ${{ matrix.config.watch_model }}
          WATCH_VERSION: ${{ matrix.config.watch_version }}

  unit_test:
    needs: unit_test_matrix
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.vm_image }}
    defaults:
      run:
        working-directory: packages/webdriveragent
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.unit_test_matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/webdriveragent-xcode-setup
        with:
          xcode_version: ${{ matrix.config.xcode_version }}
      - name: Run unit tests
        run: ./Scripts/build.sh
        env:
          ACTION: unit_test
          # Forwarded to the test runner as CI
          TEST_RUNNER_CI: "true"
          DEST: iphone
          TARGET: lib
          SDK: sim
          IPHONE_MODEL: ${{ matrix.config.iphone_model }}
          IPAD_MODEL: ${{ matrix.config.ipad_model }}
          IOS_VERSION: ${{ matrix.config.ios_version }}

  build_tests:
    needs: build_tests_matrix
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.vm_image }}
    defaults:
      run:
        working-directory: packages/webdriveragent
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.build_tests_matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/webdriveragent-xcode-setup
        with:
          xcode_version: ${{ matrix.config.xcode_version }}
      - name: Build tests
        run: ./Scripts/build.sh
        env:
          ACTION: build_for_testing
          TARGET: lib
          SDK: ${{ matrix.config.sdk }}
          TEST_SCHEMES: ${{ matrix.config.schemes }}
          DERIVED_DATA_PATH: ${{ runner.temp }}/wda-derived-data
      - name: Archive products
        # tar keeps the symlinks/permissions that upload-artifact's zip would drop
        run: tar -C "$RUNNER_TEMP/wda-derived-data" -czf "$RUNNER_TEMP/wda-products.tgz" Build/Products
      - uses: actions/upload-artifact@v7
        with:
          name: wda-products-${{ matrix.config.sdk }}-${{ matrix.config.xcode_version }}
          path: ${{ runner.temp }}/wda-products.tgz
          retention-days: 1
          if-no-files-found: error

  integration_test:
    needs: [integration_test_matrix, build_tests]
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.vm_image }}
    defaults:
      run:
        working-directory: packages/webdriveragent
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.integration_test_matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/webdriveragent-xcode-setup
        with:
          xcode_version: ${{ matrix.config.xcode_version }}
      # tvOS simulators sometimes fail to load on the runner (xcodebuild then only sees placeholder
      # destinations). Skip the tvOS tests with a warning instead of failing the job.
      - name: Check tvOS simulator
        id: tvos
        if: matrix.config.dest == 'tv'
        run: |
          DESTINATIONS="$(xcodebuild -project WebDriverAgent.xcodeproj -scheme WebDriverAgentRunner_tvOS -showdestinations 2>/dev/null || true)"
          if echo "$DESTINATIONS" | grep -F 'platform:tvOS Simulator' | grep -F "OS:$TV_VERSION" | grep -qF "name:$TV_MODEL"; then
            echo "tvOS simulator '$TV_MODEL' ($TV_VERSION) is available"
          else
            echo "::warning::tvOS simulator '$TV_MODEL' ($TV_VERSION) failed to load, skipping the tvOS integration tests"
            echo "$DESTINATIONS"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          TV_MODEL: ${{ matrix.config.tv_model }}
          TV_VERSION: ${{ matrix.config.tv_version }}
      # Boot (and let it settle) in a separate step so the cold boot does not compete with
      # xcodebuild for CPU and delay the first test.
      - name: Prepare simulator
        if: steps.tvos.outputs.skip != 'true'
        uses: futureware-tech/simulator-action@v6
        with:
          model: ${{ matrix.config.dest == 'iphone' && matrix.config.iphone_model || matrix.config.dest == 'ipad' && matrix.config.ipad_model || matrix.config.dest == 'tv' && matrix.config.tv_model || matrix.config.watch_model }}
          os: ${{ matrix.config.dest == 'tv' && 'tvOS' || matrix.config.dest == 'watch' && 'watchOS' || 'iOS' }}
          os_version: ${{ matrix.config.dest == 'tv' && matrix.config.tv_version || matrix.config.dest == 'watch' && matrix.config.watch_version || matrix.config.ios_version }}
          shutdown_after_job: false
          wait_for_boot: true
          settle_timeout_seconds: 60
          settle_cpu_threshold_percent: 70
      - uses: actions/download-artifact@v8
        if: steps.tvos.outputs.skip != 'true'
        with:
          name: wda-products-${{ matrix.config.sdk }}-${{ matrix.config.xcode_version }}
          path: ${{ runner.temp }}/wda-products
      - name: Extract prebuilt tests
        if: steps.tvos.outputs.skip != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/wda-derived-data"
          tar -C "$RUNNER_TEMP/wda-derived-data" -xzf "$RUNNER_TEMP/wda-products/wda-products.tgz"
      - name: Run integration test
        if: steps.tvos.outputs.skip != 'true'
        run: ./Scripts/build.sh
        env:
          DERIVED_DATA_PATH: ${{ runner.temp }}/wda-derived-data
          ACTION: ${{ matrix.config.action }}
          DEST: ${{ matrix.config.dest }}
          TARGET: lib
          SDK: ${{ matrix.config.sdk }}
          IPHONE_MODEL: ${{ matrix.config.iphone_model }}
          IPAD_MODEL: ${{ matrix.config.ipad_model }}
          IOS_VERSION: ${{ matrix.config.ios_version }}
          TV_MODEL: ${{ matrix.config.tv_model }}
          TV_VERSION: ${{ matrix.config.tv_version }}
          WATCH_MODEL: ${{ matrix.config.watch_model }}
          WATCH_VERSION: ${{ matrix.config.watch_version }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 600
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: 2
