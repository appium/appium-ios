name: iOS Xcode/Runtime Matrix (Reusable)

# Single source of truth for the Xcode/iOS-runtime/device-name combinations that every package's
# real-simulator test suite runs against - coresim's integration tests, xcode's and simulator's
# e2e/functional tests (via build.yml), and WebDriverAgent's oldest/newest legs (min/max outputs).
# Keeping them in one place means all packages are always tested against the same simulators
# instead of drifting out of sync across separate per-workflow copies of this matrix.

on:
  workflow_call:
    outputs:
      matrix:
        description: JSON array of {xcodeVersion, iosVersion, deviceName, ipadDeviceName, tvosVersion, tvosDeviceName, watchosVersion, watchosDeviceName, image} objects
        value: ${{ jobs.matrix.outputs.matrix }}
      min:
        description: The oldest {xcodeVersion, iosVersion, deviceName, ipadDeviceName, tvosVersion, tvosDeviceName, watchosVersion, watchosDeviceName, image} entry of the matrix
        value: ${{ jobs.matrix.outputs.min }}
      max:
        description: The newest {xcodeVersion, iosVersion, deviceName, ipadDeviceName, tvosVersion, tvosDeviceName, watchosVersion, watchosDeviceName, image} entry of the matrix
        value: ${{ jobs.matrix.outputs.max }}

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      min: ${{ steps.set.outputs.min }}
      max: ${{ steps.set.outputs.max }}
    steps:
      - id: set
        run: |
          # "image" is the runs-on runner image - each Xcode version only ships on specific
          # macOS runner images, so it travels with xcodeVersion in the same matrix entry rather
          # than being picked independently.
          # Don't guess versions/devices: only preinstalled simulator runtimes and models work.
          # See "Installed Xcode/SDKs/Simulators" in https://github.com/actions/runner-images/tree/main/images/macos
          # (<image>-arm64-Readme.md, e.g. macos-26-arm64, xcode-27-arm64).
          json='[
            {"xcodeVersion": "27.1", "iosVersion": "27.0", "deviceName": "iPhone 17", "ipadDeviceName": "iPad Air 11-inch (M4)",
             "tvosVersion": "27.0", "tvosDeviceName": "Apple TV 4K (3rd generation)",
             "watchosVersion": "27.0", "watchosDeviceName": "Apple Watch Series 12 (46mm)", "image": "xcode-27"},
            {"xcodeVersion": "26.5", "iosVersion": "26.5", "deviceName": "iPhone 17", "ipadDeviceName": "iPad Air 13-inch (M4)",
             "tvosVersion": "26.5", "tvosDeviceName": "Apple TV 4K (3rd generation)",
             "watchosVersion": "26.5", "watchosDeviceName": "Apple Watch Series 11 (46mm)", "image": "macos-26"}
          ]'
          echo "matrix=$(echo "$json" | jq -c .)" >> "$GITHUB_OUTPUT"
          # Ends of the matrix by Xcode version, for suites that only run the oldest/newest legs.
          sorted='sort_by(.xcodeVersion | split(".") | map(tonumber))'
          echo "min=$(echo "$json" | jq -c "$sorted | .[0]")" >> "$GITHUB_OUTPUT"
          echo "max=$(echo "$json" | jq -c "$sorted | .[-1]")" >> "$GITHUB_OUTPUT"
