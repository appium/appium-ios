name: media-proxy CI

# Path-scoped like tuntap-ci.yml: the native build needs a toolchain the rest of the monorepo's CI
# doesn't, so it stays out of build.yml entirely.

on:
  push:
    branches: [main]
    paths: ['packages/media-proxy/**', '.github/actions/media-proxy-ffmpeg/**']
  pull_request:
    branches: [main]
    paths: ['packages/media-proxy/**', '.github/actions/media-proxy-ffmpeg/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node_matrix:
    uses: appium/appium-workflows/.github/workflows/node-lts-matrix.yml@main

  prebuild:
    uses: ./.github/workflows/media-proxy-prebuild.yml
    with:
      upload-artifacts: false

  # Pure TS against a fake backend, so one OS is enough; the native paths run on all three in
  # integration-test. C++ lint/format are OS-independent (no platform-specific sources).
  unit-test:
    needs: node_matrix
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(needs.node_matrix.outputs.versions) }}
    uses: ./.github/workflows/media-proxy-shared-test.yml
    with:
      image: ubuntu-latest
      node-version: ${{ matrix.node-version }}
      test-command: test:unit
      test-name: Unit tests
      run-cpp-format-check: true
      run-cpp-lint: true

  integration-test:
    if: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu-latest, macos-latest, windows-2022]
    uses: ./.github/workflows/media-proxy-shared-test.yml
    with:
      image: ${{ matrix.image }}
      node-version: lts/*
      test-command: test:integration
      test-name: Integration tests
