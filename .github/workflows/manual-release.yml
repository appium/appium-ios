name: Appium iOS Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no publishing or tagging)'
        required: true
        type: boolean
        default: true
      recover_missing_only:
        description: 'Recovery mode: skip version bump, publish only packages missing on npm at their current package.json version'
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write # to enable use of OIDC for trusted publishing and npm provenance

jobs:
  # Delegates the whole release (lerna publish + uicatalog app upload) to release.yml rather
  # than running it here, so the npm publish step always runs as release.yml - the workflow
  # file appium-xcode's npm trusted publisher (OIDC) is pinned to.
  release:
    if: github.ref == 'refs/heads/main' && contains(fromJSON('["mykola-mokhnach", "jlipps", "eglitise", "KazuCocoa"]'), github.actor)
    uses: ./.github/workflows/release.yml
    with:
      dry_run: ${{ inputs.dry_run }}
      recover_missing_only: ${{ inputs.recover_missing_only }}
