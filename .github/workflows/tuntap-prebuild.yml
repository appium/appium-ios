name: Build tuntap native addon (Reusable)

# N-API prebuild matrix (darwin x64/arm64, linux x64/arm64, win32 x64/arm64), ported from
# appium-ios-tuntap's own prebuild.yml. Called both as a PR smoke build (upload-artifacts:
# false) and from release.yml before publishing, so a real release always ships prebuilds.

on:
  workflow_call:
    inputs:
      upload-artifacts:
        description: Upload each platform's .node as a workflow artifact
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  prebuild:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: macos-latest
            arch: arm64
            artifact: darwin-arm64
          - runs-on: macos-latest
            arch: x64
            artifact: darwin-x64
          - runs-on: ubuntu-latest
            arch: x64
            artifact: linux-x64
          - runs-on: ubuntu-24.04-arm
            arch: arm64
            artifact: linux-arm64
          - runs-on: windows-2022
            arch: x64
            artifact: win32-x64
          - runs-on: windows-11-arm
            arch: arm64
            artifact: win32-arm64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          check-latest: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if ! sudo apt-get install -y linux-headers-$(uname -r); then
            sudo apt-get install -y linux-headers-generic
          fi

      - name: Configure Windows vcpkg cache
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $triplet = if ("${{ matrix.arch }}" -eq "arm64") { "arm64-windows-static" } else { "x64-windows-static" }
          "VCPKG_OPENSSL_TRIPLET=$triplet" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DEFAULT_BINARY_CACHE=$env:RUNNER_TEMP\vcpkg-binary-cache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\vcpkg-binary-cache" | Out-Null

      - name: Restore Windows vcpkg binary cache
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\vcpkg-binary-cache
          key: ${{ runner.os }}-vcpkg-openssl-${{ matrix.arch }}-${{ hashFiles('.github/workflows/tuntap-prebuild.yml') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-openssl-${{ matrix.arch }}-

      - name: Install Windows OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install "openssl:$env:VCPKG_OPENSSL_TRIPLET"
          "OPENSSL_ROOT_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\$env:VCPKG_OPENSSL_TRIPLET" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies
        # --ignore-scripts: skip every workspace's own install/prepare hooks (including
        # tuntap's node-gyp-build) - build:prebuilds below invokes node-gyp itself.
        run: npm ci --ignore-scripts

      - name: Create N-API prebuild
        run: npm run build:prebuilds --workspace packages/tuntap -- --arch ${{ matrix.arch }}

      - name: Upload prebuild
        if: ${{ inputs.upload-artifacts }}
        uses: actions/upload-artifact@v7
        with:
          name: tuntap-prebuild-${{ matrix.artifact }}
          path: packages/tuntap/prebuilds/
