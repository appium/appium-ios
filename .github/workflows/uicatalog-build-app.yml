name: Build ios-uicatalog App (Reusable)

on:
  workflow_call:
    inputs:
      upload_pr_artifacts:
        description: 'Whether to upload build artifacts as GitHub Actions artifacts'
        required: false
        type: boolean
        default: false
      upload_release_artifacts:
        description: 'Whether to upload build artifacts to a release'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Release tag name for artifact upload'
        required: false
        type: string
        default: ''
      checkout_ref:
        description: 'Git ref to checkout'
        required: false
        type: string
        default: ''

jobs:
  build-ios:
    name: Build ios-uicatalog App
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Setup, install and build
        uses: ./.github/actions/setup-build
        with:
          node-version: 'lts/*'
          install-command: npm ci --foreground-scripts
          run-build: 'false'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - name: Clean build directory
        working-directory: packages/uicatalog
        run: rm -rf UIKitCatalog/build

      - name: Build iOS App for Simulator
        run: npm run build:uicatalog:simulator -w packages/uicatalog

      - name: Create ZIP archive
        working-directory: packages/uicatalog
        run: |
          APP_PATH="UIKitCatalog/build/Build/Products/Release-iphonesimulator/UIKitCatalog.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: App not found at $APP_PATH"
            echo "Build directory structure:"
            find UIKitCatalog/build -type d 2>/dev/null | head -20
            exit 1
          fi
          WORKSPACE_ROOT=$(pwd)
          cd UIKitCatalog/build/Build/Products/Release-iphonesimulator
          zip -r "UIKitCatalog-iphonesimulator.zip" "UIKitCatalog.app"
          mv "UIKitCatalog-iphonesimulator.zip" "$WORKSPACE_ROOT/"

      - name: Upload iOS App as Artifact
        if: inputs.upload_pr_artifacts == true
        uses: actions/upload-artifact@v7
        with:
          name: UIKitCatalog-iphonesimulator.zip
          path: packages/uicatalog/UIKitCatalog-iphonesimulator.zip
          retention-days: 7

      - name: Upload iOS App to Release
        if: inputs.upload_release_artifacts == true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag }}
          files: |
            packages/uicatalog/UIKitCatalog-iphonesimulator.zip
          token: ${{ secrets.GITHUB_TOKEN }}
