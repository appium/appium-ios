name: Appium iOS Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CI: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare_matrix:
    uses: appium/appium-workflows/.github/workflows/node-lts-matrix.yml@main

  xcode_matrix:
    uses: ./.github/workflows/ios-xcode-matrix.yml

  prepare_affected_packages:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      e2e_packages: ${{ steps.discover-packages.outputs.e2e_packages }}
      unit_packages: ${{ steps.discover-packages.outputs.unit_packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Discover packages affected by this PR
        id: discover-packages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/discover-affected-packages.mjs

  test-unit:
    needs:
      - prepare_matrix
      - prepare_affected_packages
    # prepare_affected_packages only runs for pull_request; don't let its skip on push cascade
    # into skipping this job too (push always runs the full suite, see run-unit-tests.mjs).
    if: ${{ !cancelled() }}
    name: Unit Tests
    strategy:
      matrix:
        node-version: ${{ fromJSON(needs.prepare_matrix.outputs.versions) }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup, install and build
        uses: ./.github/actions/setup-build
        with:
          node-version: ${{ matrix.node-version }}
          # Scoped to skip packages/tuntap's native (node-gyp) install - it has its own
          # dedicated CI (tuntap-ci.yml) with the toolchain that needs. packages/simulator pulls
          # in packages/coresim's native addon transitively (its own dependency), so that one
          # still gets built here.
          install-command: npm ci --workspace=packages/xcode --workspace=packages/uicatalog --workspace=packages/simulator --include-workspace-root --foreground-scripts
          run-build: 'true'
      - name: Run unit tests
        env:
          EVENT_NAME: ${{ github.event_name }}
          UNIT_PACKAGES: ${{ needs.prepare_affected_packages.outputs.unit_packages }}
        run: node scripts/run-unit-tests.mjs

  test-e2e:
    needs:
      - prepare_affected_packages
      - xcode_matrix
    name: E2E Tests - ${{ matrix.package_dir }} (Xcode ${{ matrix.combo.xcodeVersion }})
    if: ${{ github.event_name == 'pull_request' && needs.prepare_affected_packages.outputs.e2e_packages != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        package_dir: ${{ fromJSON(needs.prepare_affected_packages.outputs.e2e_packages) }}
        # Same Xcode/iOS-runtime/device-name combinations coresim's integration tests run
        # against (see ios-xcode-matrix.yml) - keeps every package's real-simulator test suite
        # aligned instead of each drifting to whatever "macos-latest" happens to ship by default.
        combo: ${{ fromJSON(needs.xcode_matrix.outputs.matrix) }}
    runs-on: ${{ matrix.combo.image }}
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode ${{ matrix.combo.xcodeVersion }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.combo.xcodeVersion }}
      - name: Setup, install and build
        uses: ./.github/actions/setup-build
        with:
          node-version: lts/*
          # Scoped to skip packages/tuntap's native (node-gyp) install - discover-affected-packages.mjs
          # never selects it (no real test:e2e script) and it has its own dedicated CI.
          # packages/simulator pulls in packages/coresim's native addon transitively.
          install-command: npm ci --workspace=packages/xcode --workspace=packages/uicatalog --workspace=packages/simulator --include-workspace-root --foreground-scripts
          run-build: 'true'
      - name: Run E2E tests for ${{ matrix.package_dir }}
        env:
          # Consumed by packages/simulator's functional specs (MOBILE_OS_VERSION/MOBILE_DEVICE_NAME
          # default to values that don't exist on every runner - see PR #17 review discussion).
          # packages/xcode's e2e tests don't read these; harmless to set regardless.
          MOBILE_OS_VERSION: ${{ matrix.combo.iosVersion }}
          MOBILE_DEVICE_NAME: ${{ matrix.combo.deviceName }}
          XCODE_VERSION: ${{ matrix.combo.xcodeVersion }}
        run: |
          set -o pipefail
          cd "packages/${{ matrix.package_dir }}"
          npm run test:e2e

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup and install (no build)
        uses: ./.github/actions/setup-build
        with:
          node-version: lts/*
          # Scoped to skip packages/tuntap's native (node-gyp) install - it has its own
          # dedicated CI (tuntap-ci.yml) with the toolchain that needs.
          install-command: npm ci --workspace=packages/xcode --workspace=packages/uicatalog --workspace=packages/simulator --include-workspace-root
          run-build: 'false'
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
