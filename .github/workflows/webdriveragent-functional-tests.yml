name: WebDriverAgent Functional Tests

on:
  pull_request:
    paths:
      - 'packages/webdriveragent/**'
      - '!packages/webdriveragent/**/*.md'
      - '!packages/webdriveragent/docs/**'
      - '.github/workflows/webdriveragent-functional-tests.yml'
      - '.github/actions/webdriveragent-xcode-setup/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  xcode_matrix:
    uses: ./.github/workflows/ios-xcode-matrix.yml

  prepare_matrix:
    needs: xcode_matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        # Xcode/runtime/runner/iPhone come from the shared min/max (ios-xcode-matrix.yml); tvOS
        # shares the iOS runtime version, the watchOS runtime and tv/watch models are WDA-specific.
        env:
          MIN: ${{ needs.xcode_matrix.outputs.min }}
          MAX: ${{ needs.xcode_matrix.outputs.max }}
        run: |
          jq -nc --argjson min "$MIN" --argjson max "$MAX" '
            def targets($c; $watchVersion; $watchName): [
              {HOST_OS: $c.image, XCODE_VERSION: $c.xcodeVersion, PLATFORM_NAME: "iOS", PLATFORM_VERSION: $c.iosVersion, DEVICE_NAME: $c.deviceName},
              {HOST_OS: $c.image, XCODE_VERSION: $c.xcodeVersion, PLATFORM_NAME: "tvOS", PLATFORM_VERSION: $c.iosVersion, DEVICE_NAME: "Apple TV 4K (3rd generation)"},
              {HOST_OS: $c.image, XCODE_VERSION: $c.xcodeVersion, PLATFORM_NAME: "watchOS", PLATFORM_VERSION: $watchVersion, DEVICE_NAME: $watchName}
            ];
            targets($max; $max.iosVersion; "Apple Watch Series 12 (46mm)") + targets($min; $min.iosVersion; "Apple Watch Series 11 (46mm)")
          ' | sed 's/^/matrix=/' >> "$GITHUB_OUTPUT"

  test:
    needs: prepare_matrix
    strategy:
      fail-fast: false
      matrix:
        test_targets: ${{ fromJSON(needs.prepare_matrix.outputs.matrix) }}

    # https://github.com/actions/runner-images/blob/main/images/macos/macos-15-Readme.md
    runs-on: ${{matrix.test_targets.HOST_OS}}
    defaults:
      run:
        working-directory: packages/webdriveragent
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: lts/*
        check-latest: true
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{matrix.test_targets.XCODE_VERSION}}
    - run: npm ci --workspace=packages/webdriveragent --include-workspace-root --foreground-scripts
      name: Install dependencies
      working-directory: ${{ github.workspace }}
    - run: |
        npm run build
        mkdir -p ./Resources/WebDriverAgent.bundle
      name: Build

    - run: xcrun simctl list devices available
      name: List Installed Simulators
    - run: xcrun simctl list runtimes
      name: List Runtimes
    - name: Start Simulator UI
      # Xcode 27 replaced Simulator.app with DeviceHub.app, one directory level up from
      # Simulator.app's location (Contents/Applications instead of Contents/Developer/Applications).
      run: |
        if [ "${PLATFORM_VERSION%%.*}" -ge 27 ]; then
          open -Fn "$(xcode-select --print-path)/../Applications/DeviceHub.app"
        else
          open -Fn "$(xcode-select --print-path)/Applications/Simulator.app"
        fi
      env:
        PLATFORM_VERSION: ${{matrix.test_targets.PLATFORM_VERSION}}
    - name: Prepare simulator
      id: prepareSimulator
      uses: futureware-tech/simulator-action@v6
      with:
        model: '${{matrix.test_targets.DEVICE_NAME}}'
        os: '${{matrix.test_targets.PLATFORM_NAME}}'
        os_version: '${{matrix.test_targets.PLATFORM_VERSION}}'
        shutdown_after_job: false
        wait_for_boot: true
        settle_timeout_seconds: 150
        settle_cpu_threshold_percent: 30

    - run: npm run e2e-test
      name: Run functional tests
      env:
        CI: true
        _FORCE_LOGS: 1
        _LOG_TIMESTAMP: 1
        DEVICE_NAME: ${{matrix.test_targets.DEVICE_NAME}}
        PLATFORM_NAME: ${{matrix.test_targets.PLATFORM_NAME}}
        PLATFORM_VERSION: ${{matrix.test_targets.PLATFORM_VERSION}}
        SIMULATOR_UDID: ${{steps.prepareSimulator.outputs.udid}}
