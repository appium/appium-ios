version: v1

labels:
  - label: 'enhancement'
    sync: true
    matcher:
      title: '^feat.*?:'

  - label: 'bug'
    sync: true
    matcher:
      title: '^fix.*?:'

  - label: 'documentation'
    sync: true
    matcher:
      title: '^docs.*?:'
      files: ['**/*.md']

  - label: 'chore'
    sync: true
    matcher:
      title: '^(?!feat|fix|docs).*?:'

  - label: 'semver:breaking'
    sync: true
    matcher:
      title: '^(.+?)!:'
      commits: '^(.+?)!:'

  - label: 'dependencies'
    sync: true
    matcher:
      files: ['**/package.json', 'package-lock.json']

  - label: 'package:coresim'
    sync: true
    matcher:
      files: ['packages/coresim/**']

  - label: 'package:devicectl'
    sync: true
    matcher:
      files: ['packages/devicectl/**']

  - label: 'package:remote-debugger'
    sync: true
    matcher:
      files: ['packages/remote-debugger/**']

  - label: 'package:remotexpc'
    sync: true
    matcher:
      files: ['packages/remotexpc/**']

  - label: 'package:resigner'
    sync: true
    matcher:
      files: ['packages/resigner/**']

  - label: 'package:simulator'
    sync: true
    matcher:
      files: ['packages/simulator/**']

  - label: 'package:tuntap'
    sync: true
    matcher:
      files: ['packages/tuntap/**']

  - label: 'package:uicatalog'
    sync: true
    matcher:
      files: ['packages/uicatalog/**']

  - label: 'package:xcode'
    sync: true
    matcher:
      files: ['packages/xcode/**']
